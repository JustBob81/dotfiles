---
- name: Configure the Ubuntu Resolute baseline
  hosts: laptops
  gather_facts: true
  become: false
  vars:
    laptop_repository_policy: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../config/apt-repositories-resolute.json') | from_json }}"
    laptop_expected_managed_sources: []
    laptop_disable_partner_source: false
    laptop_package_groups:
      base:
        - ca-certificates
        - curl
        - direnv
        - git
        - gnupg
        - libatomic1
        - zsh
      containers:
        - docker.io
        - docker-compose-v2
      databases:
        - postgresql
      haskell:
        - ghc
        - cabal-install
        - haskell-stack
      desktop:
        - caffeine
        - flatpak
        - pandoc
        - latexmk
        - texlive-fonts-recommended
        - texlive-latex-extra
        - texlive-latex-recommended
        - texlive-luatex
        - texlive-pictures
        - texlive-xetex
        - binutils
        - gnupg
        - remmina
        - remmina-plugin-rdp
        - remmina-plugin-vnc
        - remmina-plugin-secret
      additional_apps:
        - asunder
        - flatpak
        - libfuse2t64
        - libegl1
        - libopengl0
        - libxcb-cursor0
        - libxcb-xinerama0
        - libreoffice
        - python3
        - simple-scan
        - xdg-utils
        - xz-utils
      mongodb:
        - mongodb-org
    laptop_enabled_package_groups: [base]
    laptop_manage_packages: false
    laptop_application_repositories: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../config/application-repositories-resolute.json') | from_json }}"
    laptop_application_packages: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../config/application-packages-resolute.json') | from_json }}"
    laptop_manage_bruno: false
    laptop_manage_ulauncher: false
    laptop_manage_albert: false
    laptop_manage_chrome: false
    laptop_manage_firefox: false
    laptop_manage_gimp: false
    laptop_manage_spotify: false
    laptop_manage_parabolic: false
    laptop_manage_additional_apps: false
    laptop_manage_calibre: false
    laptop_manage_gnome_appearance: false
    laptop_manage_zoom: false
    laptop_manage_minikube: false
    laptop_manage_emacs: false
    laptop_calibre_install_root: "{{ ansible_facts['env']['HOME'] }}/.local/opt/calibre"
    laptop_calibre_install_dir: "{{ laptop_calibre_install_root }}/{{ laptop_application_packages.calibre.version }}"
    laptop_calibre_launcher: "{{ ansible_facts['env']['HOME'] }}/.local/bin/calibre"
    laptop_calibre_desktop_file: "{{ ansible_facts['env']['HOME'] }}/.local/share/applications/calibre.desktop"
    laptop_calibre_marker_content: "Managed by dotfiles: Calibre {{ laptop_application_packages.calibre.version }}\n"
    laptop_calibre_desktop_content: |
      [Desktop Entry]
      Type=Application
      Name=Calibre
      Comment=E-book library management
      Exec={{ ansible_facts['env']['HOME'] }}/.local/bin/calibre %F
      Icon=application-epub+zip
      Terminal=false
      Categories=Office;Utility;
  pre_tasks:
    - name: Require the maintained Resolute Ansible runtime
      ansible.builtin.assert:
        that:
          - ansible_version.full is version('2.21', '>=')
          - ansible_version.full is version('2.22', '<')
        fail_msg: Use the separate Resolute Hatch environment from hatch.toml.

    - name: Require Ubuntu 26.04 Resolute
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == 'Ubuntu'
          - ansible_facts['distribution_release'] == 'resolute'
        fail_msg: This profile only targets Ubuntu 26.04 Resolute.

    - name: Require a supported managed-host Python
      ansible.builtin.assert:
        that:
          - ansible_facts['python']['version']['major'] == 3
          - ansible_facts['python']['version']['minor'] >= 9
          - ansible_facts['python']['version']['minor'] <= 14
        fail_msg: Ansible Core 2.21 supports managed-host Python 3.9 through 3.14.

    - name: Require an empty third-party repository policy
      ansible.builtin.assert:
        that:
          - laptop_repository_policy['ubuntu_codename'] == 'resolute'
          - laptop_repository_policy['repositories'] | length == 0
          - laptop_repository_policy['external_sources']['third-party']['state'] == 'not-configured'
        fail_msg: Review the Resolute repository policy before adding vendor sources.

  roles:
    - role: repositories
      tags: [repositories]
    - role: application_tools
      tags: [application_tools]
    - role: packages
      tags: [packages]
    - role: emacs_tools
      tags: [emacs_tools]
    - role: firefox_extensions
      tags: [firefox_extensions]
