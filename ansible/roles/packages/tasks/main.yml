---
- name: Validate selected package groups
  ansible.builtin.assert:
    that:
      - laptop_enabled_package_groups | difference(laptop_package_groups.keys() | list) | length == 0
    fail_msg: A selected package group has no definition.

- name: Assemble the selected package baseline
  ansible.builtin.set_fact:
    laptop_selected_packages: >-
      {{ laptop_enabled_package_groups | map('extract', laptop_package_groups) |
         flatten | unique | sort }}

- name: Defer MongoDB package resolution in check mode until its source is applied
  ansible.builtin.set_fact:
    laptop_packages_to_install: "{{ laptop_selected_packages | difference(['mongodb-org']) }}"
  when: ansible_check_mode and laptop_manage_mongodb | default(false) | bool

- name: Select packages for explicit installation
  ansible.builtin.set_fact:
    laptop_packages_to_install: "{{ laptop_selected_packages }}"
  when: not (ansible_check_mode and laptop_manage_mongodb | default(false) | bool)

- name: Read installed package information
  ansible.builtin.package_facts:
    manager: apt

- name: Report missing baseline packages
  ansible.builtin.debug:
    msg:
      missing_packages: "{{ laptop_selected_packages | difference(ansible_facts.packages.keys() | list) }}"
      installation_enabled: "{{ laptop_manage_packages | bool }}"

- name: Ensure selected baseline packages are present when explicitly requested
  ansible.builtin.apt:
    name: "{{ laptop_packages_to_install }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
    fail_on_autoremove: true
    auto_install_module_deps: false
  become: true
  when: laptop_manage_packages | bool

- name: Explain MongoDB check-mode package deferral
  ansible.builtin.debug:
    msg: MongoDB is planned, but its repository is not refreshed in check mode; resolve mongodb-org during the explicit apply.
  when: ansible_check_mode and laptop_manage_mongodb | default(false) | bool
