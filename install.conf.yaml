---
- defaults:
    shell:
      stdout: true
      stderr: true

- clean: ['~']

- link:
    ~/.profile: profile
    ~/.bash_profile: bash_profile
    ~/.bashrc: bashrc
    ~/.bash_logout: bash_logout
    ~/.gitconfig: gitconfig
    ~/.zshrc: zshrc
    ~/.zshenv: zshenv
    ~/.zprofile: zprofile
    ~/.zlogin: zlogin
    ~/.zlogout: zlogout
    ~/.antigenrc: antigenrc
    ~/.ssh/config:
      path: ssh/config
      create: true
    ~/.gitignore_global: gitignore_global
    ~/.config/direnv/direnvrc:
      path: config/direnv/direnvrc
      create: true
    ~/.config/gh/config.yml:
      path: config/gh/config.yml
      create: true
    ~/.nvm/default-packages:
      path: nvm/default-packages
      create: true
